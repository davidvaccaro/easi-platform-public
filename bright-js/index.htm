<body>
    <h1>DICOM.JS Samples</h1>
    <div>
        <div>
            <input type="file" id="dicomFile" name="dicomFile" />
        </div>
        <br>
        <div>
            <button id="instance">Parse Instance</button>
        </div>
        <br>
        <div>
            <button id="series">Parse Series</button>
        </div>
        <br>
        <div>
            <button id="study">Parse Study</button>
        </div>
        <br>
        <div>
            <button id="dump">Parse Dump</button>
        </div>
        <div>
            <textarea id="dicomDump" rows="40" cols="80">
(0x0002,0x0010) UI Transfer Syntax UID VR=<UI> VL=<0x0014> <1.2.840.10008.1.2.1>
(0x0008,0x0016) UI SOP Class UID VR=<UI> VL=<0x001a> <1.2.840.10008.5.1.4.1.1.7>
(0x0008,0x0018) UI SOP Instance UID VR=<UI> VL=<0x0008> <2.25.503>
(0x0008,0x0020) DA Study Date VR=<DA> VL=<0x0008> <20260102>
(0x0008,0x0060) CS Modality VR=<CS> VL=<0x0002> <OT>
(0x0010,0x0010) PN Patient Name VR=<PN> VL=<0x0014> <SYNTHETIC^EASI^DUMP>
(0x0010,0x0020) LO Patient ID VR=<LO> VL=<0x0012> <EASI-SYNTHETIC-001>
(0x0020,0x000d) UI Study Instance UID VR=<UI> VL=<0x0008> <2.25.501>
(0x0020,0x000e) UI Series Instance UID VR=<UI> VL=<0x0008> <2.25.502>
(0x0028,0x0010) US Rows VR=<US> VL=<0x0002> [0x0002]
(0x0028,0x0011) US Columns VR=<US> VL=<0x0002> [0x0002]
</textarea>
        </div>
    </div>
    <div>
    </div>

    <script type="module">

        import DicomInstanceEmitter from './src/dicomInstanceEmitter.js';
        import DicomParser from './src/dicomParser.js';
        import DicomReader from './src/dicomReader.js';
        
        import DicomDumpParser from './src/test/dicomDumpParser.js';

        $(function () {

            
            // Set the top-level exception handler
            window.onerror = function (message, source, lineno, columnno, error) {

                // Alert the error message
                alert(message);

                // The exception is handled, don't show to the user.
                return true;

            }            

            $('#dicomFile').on('change', function () {

                // Cleare the console
                console.clear();

                // Create an object URL from the selected file
                var url = URL.createObjectURL(this.files[0]);

                // Create the DICOM reader
                var reader = new DicomReader(new DicomParser(new DicomInstanceEmitter()));

                // Read and parse the DICOM file
                reader
                    .read(url)
                    .then(result => console.log(result))
                    .catch(err => console.log(err));

            });

            // Handle Instance
            $('#instance').on('click', function () {

                // Cleare the console
                console.clear();

                // Create an object URL from the selected file
                var url = "https://server.dcmjs.org/dcm4chee-arc/aets/DCM4CHEE/rs/studies/1.3.6.1.4.1.14519.5.2.1.7009.2403.129940714907926843330943219641/series/1.3.6.1.4.1.14519.5.2.1.7009.2403.338964154217479272713063899583/instances/1.3.6.1.4.1.14519.5.2.1.7009.2403.178093459220118793111194022094";

                // Create the DICOM reader
                var reader = new DicomReader(new DicomParser(new DicomInstanceEmitter()));

                // Read and parse the DICOM file
                reader
                    .read(url)
                    .then(result => console.log(result))
                    .catch(err => console.log(err));

            });

            // Handle Series
            $('#series').on('click', function () {

                // Cleare the console
                console.clear();

                // Create an object URL from the selected file
                var url = "https://server.dcmjs.org/dcm4chee-arc/aets/DCM4CHEE/rs/studies/1.3.6.1.4.1.14519.5.2.1.7009.2403.129940714907926843330943219641/series/1.3.6.1.4.1.14519.5.2.1.7009.2403.338964154217479272713063899583";

                // Create the DICOM reader
                var reader = new DicomReader(new DicomParser(new DicomInstanceEmitter()));

                // Read and parse the DICOM file
                reader
                    .read(url)
                    .then(result => console.log(result))
                    .catch(err => console.log(err));

            });            

            // Handle Study
            $('#study').on('click', function () {

                // Cleare the console
                console.clear();

                // Create an object URL from the selected file
                var url = "https://server.dcmjs.org/dcm4chee-arc/aets/DCM4CHEE/rs/studies/1.3.6.1.4.1.14519.5.2.1.7009.2403.129940714907926843330943219641";

                // Create the DICOM reader
                var reader = new DicomReader(new DicomParser(new DicomInstanceEmitter()));

                // Read and parse the DICOM file
                reader
                    .read(url)
                    .then(result => console.log(result))
                    .catch(err => console.log(err));

            });            

            // Handle Dump
            $('#dump').on('click', function () {

                // Cleare the console
                console.clear();

                // Create the DICOM Dump Parer
                var parser = new DicomDumpParser(new DicomInstanceEmitter());

                parser.parse($('#dicomDump').val());

            });            

        });
    </script>

</body>
