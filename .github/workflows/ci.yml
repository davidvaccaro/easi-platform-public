name: EASI JS CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: "Run streaming benchmarks"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "15 5 * * *"

permissions:
  contents: read

concurrency:
  group: easi-js-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.x"
  WORKDIR: easi-js

jobs:
  core:
    name: Core Tests (Node ${{ matrix.node }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x"]
    env:
      EASI_CONTRACTS_ROOT: ${{ github.workspace }}/easi-docs/easi-contracts
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Canonical API Contracts
        uses: actions/checkout@v4
        with:
          repository: davidvaccaro/easi
          ref: main
          path: easi-docs
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: easi-js/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Check Source Publication Assets
        run: npm run source:check

      - name: Run Core Test Suite
        run: npm test -- --runInBand

      - name: Run Synthetic Functional Harness
        run: npm run harness:synthetic

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easi-js-core-coverage-node-${{ matrix.node }}
          path: easi-js/coverage/lcov-report
          if-no-files-found: warn

  packaging:
    name: Package Validation (Node ${{ matrix.node }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x"]
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: easi-js/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Check Source Publication Assets
        run: npm run source:check

      - name: Validate Packed Consumers
        run: npm run package:check

      - name: Validate Packaged README Examples
        run: npm run docs:readme:check

      - name: Create Release Candidate Archive
        run: npm run package:pack

      - name: Upload Package and Inventory
        uses: actions/upload-artifact@v4
        with:
          name: easi-js-package-node-${{ matrix.node }}
          path: |
            easi-js/artifacts/*.tgz
            easi-js/artifacts/*.manifest.json
          if-no-files-found: error

  dimse-sockets:
    name: DIMSE Socket Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: easi-js/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run DIMSE Socket Tests
        run: npm run test:dimse-sockets

  orthanc-interop:
    name: Orthanc DIMSE Interop Tests
    runs-on: ubuntu-latest
    env:
      ORTHANC_HTTP_USERNAME: "orthanc"
      ORTHANC_HTTP_PASSWORD: "orthanc"
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: easi-js/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Start Pinned Orthanc Peer
        run: |
          docker run --detach --name easi-orthanc --network host \
            --volume "$PWD/tools/interop/orthanc.json:/etc/orthanc/orthanc.json:ro" \
            jodogne/orthanc:1.12.8

      - name: Wait For Orthanc Service
        run: |
          for i in {1..30}; do
            if curl -fsS -u "${ORTHANC_HTTP_USERNAME}:${ORTHANC_HTTP_PASSWORD}" \
              http://127.0.0.1:8042/system >/dev/null 2>&1; then
              echo "Orthanc is ready."
              exit 0
            fi
            sleep 1
          done
          docker logs easi-orthanc
          echo "Orthanc did not become ready in time."
          exit 1

      - name: Validate Orthanc Modality Routing
        run: |
          curl -fsS -u "${ORTHANC_HTTP_USERNAME}:${ORTHANC_HTTP_PASSWORD}" \
            http://127.0.0.1:8042/modalities > /tmp/easi-orthanc-modalities.json
          node --input-type=module -e '
            import fs from "node:fs";
            const modalities = JSON.parse(fs.readFileSync("/tmp/easi-orthanc-modalities.json", "utf8"));
            for (const ae of ["EASI_JS", "EASI_MOVE_DEST"]) {
              if (!modalities.includes(ae)) throw new Error(`Missing peer modality ${ae}`);
            }
          '

      - name: Run Orthanc DIMSE Interop Tests
        env:
          RUN_ORTHANC_DIMSE: "true"
          RUN_ORTHANC_DIMSE_MOVE: "true"
          ORTHANC_HTTP_URL: "http://127.0.0.1:8042"
          ORTHANC_HTTP_USERNAME: ${{ env.ORTHANC_HTTP_USERNAME }}
          ORTHANC_HTTP_PASSWORD: ${{ env.ORTHANC_HTTP_PASSWORD }}
          ORTHANC_DIMSE_HOST: "127.0.0.1"
          ORTHANC_DIMSE_PORT: "4242"
          ORTHANC_DIMSE_CALLED_AE: "ORTHANC"
          ORTHANC_DIMSE_CALLING_AE: "EASI_JS"
          # The peer shares the runner network; C-MOVE routes through loopback.
          # All enabled operations fail the lane on protocol or routing errors.
          ORTHANC_MOVE_DEST_AE: "EASI_MOVE_DEST"
          ORTHANC_MOVE_STORE_HOST: "127.0.0.1"
          ORTHANC_MOVE_STORE_PORT: "4104"
          ORTHANC_MOVE_STORE_CALLED_AE: "EASI_MOVE_DEST"
        run: npm run test:orthanc-dimse-all

      - name: Orthanc Logs
        if: always()
        run: docker logs easi-orthanc

      - name: Stop Disposable Orthanc Peer
        if: always()
        run: docker rm --force easi-orthanc

  benchmarks:
    name: Streaming Benchmarks
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_benchmarks)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: easi-js/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Streaming Benchmarks
        env:
          BENCH_ITERATIONS: "2"
        run: npm run bench:streaming

      - name: Upload Benchmark Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easi-js-benchmarks
          path: easi-js/test/output/benchmarks
          if-no-files-found: warn
