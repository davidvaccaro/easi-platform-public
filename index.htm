<!DOCTYPE html>
<html>

<head>
    <title>DICOM.JS Samples</title>

    <!-- JQuery -->
    <script src="js/jquery.js"></script>

    <!-- Javascript Files -->
    <script src="js/dicomConstants.js"></script>
    <script src="js/dicomConfiguration.js"></script>
    <script src="js/dicomUtilities.js"></script>
    <script src="js/dicomException.js"></script>

    <script src="js/dicomTransferSyntax.js"></script>
    <script src="js/dicomValueRepresentation.js"></script>
    <script src="js/dicomTag.js"></script>
    <script src="js/dicomDictionaries.js"></script>
    <script src="js/dicomSOPClass.js"></script>

    <script src="js/dicomData.js"></script>
    <script src="js/dicomDataElement.js"></script>
    <script src="js/dicomAttribute.js"></script>
    <script src="js/dicomAttributeSet.js"></script>
    <script src="js/dicomItem.js"></script>
    <script src="js/dicomAttributeSequence.js"></script>
    <script src="js/dicomPreamble.js"></script>
    <script src="js/dicomPrefix.js"></script>
    <script src="js/dicomDataSet.js"></script>
    <script src="js/dicomMetaSet.js"></script>

    <script src="js/dicomInstance.js"></script>

    <script src="js/dicomEmitter.js"></script>
    <script src="js/dicomInstanceEmitter.js"></script>
    <script src="js/dicomParser.js"></script>
    <script src="js/dicomReader.js"></script>

    <!-- Javascript Test Files -->
    <script src="js/test/dicomPerformanceEmitter.js"></script>

</head>

<body>
    <h1>DICOM.JS Samples</h1>
    <div>
        <div>
            <input type="file" id="dicomFile" name="dicomFile" />
        </div>
        <div>
            <button id="instance">Parse Instance</button>
        </div>
        <div>
            <button id="series">Parse Series</button>
        </div>
    </div>
    <div>
    </div>

    <script>
        $(function () {

            // Set the top-level exception handler
            window.onerror = function (message, source, lineno, columnno, error) {

                // Alert the error message
                alert(message);

                // The exception is handled, don't show to the user.
                return true;

            }            

            $('#dicomFile').on('change', function () {

                // Cleare the console
                console.clear();

                // Create an object URL from the selected file
                var url = URL.createObjectURL(this.files[0]);
                //var url = "https://server.dcmjs.org/dcm4chee-arc/aets/DCM4CHEE/rs/studies/1.3.6.1.4.1.14519.5.2.1.7009.2403.129940714907926843330943219641/series/1.3.6.1.4.1.14519.5.2.1.7009.2403.338964154217479272713063899583/instances/1.3.6.1.4.1.14519.5.2.1.7009.2403.178093459220118793111194022094";
                //var url = "https://server.dcmjs.org/dcm4chee-arc/aets/DCM4CHEE/rs/studies/1.3.6.1.4.1.14519.5.2.1.7009.2403.129940714907926843330943219641/series/1.3.6.1.4.1.14519.5.2.1.7009.2403.338964154217479272713063899583";

                // Create the DICOM reader
                var reader = new DicomReader(new DicomParser(new DicomInstanceEmitter()));

                // Read and parse the DICOM file
                reader
                    .read(url)
                    .then(result => console.log(result))
                    .catch(err => console.log(err));

            });

            // Handle Instance
            $('#instance').on('click', function () {

                // Cleare the console
                console.clear();

                // Create an object URL from the selected file
                var url = "https://server.dcmjs.org/dcm4chee-arc/aets/DCM4CHEE/rs/studies/1.3.6.1.4.1.14519.5.2.1.7009.2403.129940714907926843330943219641/series/1.3.6.1.4.1.14519.5.2.1.7009.2403.338964154217479272713063899583/instances/1.3.6.1.4.1.14519.5.2.1.7009.2403.178093459220118793111194022094";

                // Create the DICOM reader
                var reader = new DicomReader(new DicomParser(new DicomInstanceEmitter()));

                // Read and parse the DICOM file
                reader
                    .read(url)
                    .then(result => console.log(result))
                    .catch(err => console.log(err));

            });

            // Handle Series
            $('#series').on('click', function () {

                // Cleare the console
                console.clear();

                // Create an object URL from the selected file
                var url = "https://server.dcmjs.org/dcm4chee-arc/aets/DCM4CHEE/rs/studies/1.3.6.1.4.1.14519.5.2.1.7009.2403.129940714907926843330943219641/series/1.3.6.1.4.1.14519.5.2.1.7009.2403.338964154217479272713063899583";

                // Create the DICOM reader
                var reader = new DicomReader(new DicomParser(new DicomInstanceEmitter()));

                // Read and parse the DICOM file
                reader
                    .read(url)
                    .then(result => console.log(result))
                    .catch(err => console.log(err));

            });            

        });
    </script>

</body>

</html>
